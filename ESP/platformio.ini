[env:esp32doit-devkit-v1]
platform = espressif32
board = esp32doit-devkit-v1
framework = arduino

monitor_speed = 115200
upload_speed = 921600

lib_deps =
    bodmer/TFT_eSPI@^2.5.43                                      ; tela ILI9341
    adafruit/DHT sensor library@^1.4.6                           ; DHT11
    adafruit/Adafruit Unified Sensor@^1.1.14                     ; exigida pela DHT
    mobizt/Firebase Arduino Client Library for ESP8266 and ESP32 ; firebase

; config dos pinos da tela
build_flags =
    -DUSER_SETUP_LOADED=1
    -DILI9341_DRIVER=1
    -DTFT_WIDTH=240
    -DTFT_HEIGHT=320
    -DTFT_MISO=19
    -DTFT_MOSI=23
    -DTFT_SCLK=18
    -DTFT_CS=5
    -DTFT_DC=2
    -DTFT_RST=4
    -DLOAD_GLCD=1
    -DLOAD_FONT2=1
    -DLOAD_FONT4=1
    -DLOAD_FONT6=1
    -DSMOOTH_FONT=1
    -DSPI_FREQUENCY=40000000